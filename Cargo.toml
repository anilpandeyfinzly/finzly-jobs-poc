[package]
name = "finzly-jobs-poc"
version = "0.3.0"
edition = "2024"
publish = ["finzly-finzly-rust-hosted"]

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros", "migrate", "chrono", "uuid", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
dotenvy = "0.15"
anyhow = "1"

# Phoenix common SDKs. Scheduler-only scope: config + postgres (claim/outbox),
# kafka (publish the due event), security (tenant context for publishing).
phoenix-config-sdk = { version = "=1.1.3" }
phoenix-postgres-sdk = { version = "=1.1.9" }
phoenix-kafka-sdk = { version = "=1.1.15" }
phoenix-security-sdk =  { version = "=1.1.11" }
serde_yaml = { version = "0.9.34" }
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
chrono-tz = "0.9"
cron = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
