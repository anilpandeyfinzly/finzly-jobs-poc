[package]
name = "kafka-scheduler-demo"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone: declaring an empty workspace stops cargo from walking up into the
# parent finzly-jobs-poc package (this is a separate, independent project).
[workspace]

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
# rdkafka with cmake-build compiles librdkafka from source (needs cmake + a C
# compiler + OpenSSL headers). Avoids depending on a system librdkafka.
rdkafka = { version = "0.36", features = ["cmake-build", "tokio"] }
